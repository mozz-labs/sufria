name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format · lint · types · security gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: sufria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sufria"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      # Migrations run as postgres; the security gate then does
      # SET ROLE sufria_dashboard so isolation is exercised for real.
      MIGRATION_DATABASE_URL: postgres://postgres:devpass@localhost:5432/sufria
      # 🔴 Must be a non-superuser role. `postgres` bypasses RLS silently,
      # so isolation checks go green without checking anything. Same rule
      # is documented in .env.example.
      DATABASE_URL: postgres://sufria_dashboard:devpass@localhost:5432/sufria
      # The Conversation Engine connects as its own role. Its webhook suite
      # asserts that an inbound message lands under one restaurant's RLS
      # context and nowhere else, which only means anything if the connection
      # is actually subject to RLS — hence sufria_engine, not postgres.
      ENGINE_DATABASE_URL: postgres://sufria_engine:devpass@localhost:5432/sufria

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json — one
      # source of truth. Declaring it here too throws
      # ERR_PNPM_BAD_PM_VERSION and kills the run before any check runs.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Contrast gate (design tokens)
        run: pnpm check:contrast

      - name: Western numerals gate
        run: pnpm check:numerals

      - name: Migrations on a clean database
        run: pnpm db:migrate

      - name: Seed fixtures
        run: pnpm db:seed

      # 🔴 This is THE condition. Nothing built on top of the Guard may
      # be merged until this is green. Blueprint §5.5 — chain-isolation
      # testing is mandatory, not advisory.
      - name: 🔴 Security gate — chain isolation
        run: pnpm test:security

      - name: Database checks (critical primitives + schema drift)
        run: pnpm test:db

      - name: Unit tests
        run: pnpm -r --if-present test

  # Separate job so the PR UI shows plainly when security is the blocker.
  secrets-scan:
    name: Leaked secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Reject any committed .env
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.(local|production|staging)$'; then
            echo "::error::A .env file is committed. Purge it from git history now and rotate every key."
            exit 1
          fi
          echo "✓ no .env committed"
